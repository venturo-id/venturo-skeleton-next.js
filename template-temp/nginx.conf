# venturo.id — Nginx server block (static site)
# Pakai ini di Nginx (.htaccess / _redirects / vercel.json TIDAK dibaca Nginx).
# Lokal test: nginx -p . -c nginx-local.conf  (lihat catatan di bawah)

server {
    listen 80;
    server_name venturo.id www.venturo.id;

    # --- HTTPS redirect (aktifkan kalau sudah ada cert) ---
    # return 301 https://venturo.id$request_uri;
# }
# server {
#     listen 443 ssl http2;
#     server_name venturo.id www.venturo.id;
#     ssl_certificate     /etc/letsencrypt/live/venturo.id/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/venturo.id/privkey.pem;

    root /var/www/venturo.id;   # <-- ganti ke path folder venturo.id/ di server
    index index.html;

    # www -> non-www (opsional, aktifkan kalau mau canonical host)
    # if ($host = www.venturo.id) { return 301 $scheme://venturo.id$request_uri; }

    # 301 /index.html -> /  (hindari duplicate content)
    location = /index.html { return 301 /; }

    # 301 URL mati yang pernah terindeks
    location = /professional-programmer-kota-malang  { return 301 /; }
    location = /professional-programmer-kota-malang/ { return 301 /; }

    # Clean URL: /profile -> /profile/index.html  (samakan dgn vercel cleanUrls)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Aset hash = immutable, cache 1 tahun
    location /_assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /_woff/   { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* ^/_(components|runtimes)/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # JSON payload (CMS) - cache pendek, boleh revalidate
    location /_json/ { add_header Cache-Control "public, max-age=3600"; }

    # HTML jangan di-cache keras (biar update kebaca)
    location ~* \.html$ { add_header Cache-Control "no-cache"; }

    # Jangan expose file kerja ke publik
    location ~* \.(bak|md|conf)$ { return 404; }     # DEPLOY-NOTES.md, nginx.conf, dll
    location = /robots.txt  { }                       # tetap boleh
    location = /sitemap.xml { }

    # MIME woff2/json/svg: sudah ada di mime.types nginx modern.
    # Kalau versi lama & woff2 keserve sbg octet-stream, tambah di http{} (mime.types), JANGAN types{} di sini
    # (types{} dalam server menimpa seluruh map global -> mime lain rusak).

    # Kompresi
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2 text/plain;

    # Security header dasar (CSP sengaja diabaikan: mirror Figma inline JS/CSS + GA)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
