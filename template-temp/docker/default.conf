# venturo.id — nginx server block untuk container (TLS di-terminate di upstream/CDN).
# Diturunkan dari nginx.conf (root disesuaikan ke image, ssl dilepas).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 301 /index.html -> /  (hindari duplicate content)
    location = /index.html { return 301 /; }

    # 301 URL mati yang pernah terindeks
    location = /professional-programmer-kota-malang  { return 301 /; }
    location = /professional-programmer-kota-malang/ { return 301 /; }

    # Clean URL: /profile -> /profile/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Aset hash = immutable, cache 1 tahun
    location /_assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /_woff/   { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* ^/_(components|runtimes)/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # JSON payload (CMS) - cache pendek
    location /_json/ { add_header Cache-Control "public, max-age=3600"; }

    # HTML jangan di-cache keras
    location ~* \.html$ { add_header Cache-Control "no-cache"; }

    # Jangan expose file kerja
    location ~* \.(bak|md|conf)$ { return 404; }
    location = /robots.txt  { }
    location = /sitemap.xml { }

    # Kompresi
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2 text/plain;

    # Security header (CSP diabaikan: mirror Figma inline JS/CSS + GA)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
